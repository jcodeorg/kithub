networks:
  dev-net:
    # act_runner のジョブコンテナを同じネットワークに参加させるため、名前を固定する
    name: dev-net
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"

services:
  # --- リバースプロキシ (HTTPS自動化) ---
  caddy:
    image: caddy:2.11-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./ide:/srv/ide:ro
      - type: bind
        source: /var/lib/kithub/pages
        target: /srv/pages
        read_only: true
        bind:
          create_host_path: false
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - dev-net

  # --- データベース (Gitea用 PostgreSQL) ---
  db:
    image: postgres:18-alpine
    restart: always
    environment:
      - POSTGRES_USER=gitea
      - POSTGRES_PASSWORD=${DB_PASSWORD} # .env で管理 (scripts/init-gitea.sh または rotate-secrets.sh が生成)
      - POSTGRES_DB=gitea
    volumes:
      - ./postgres_data:/var/lib/postgresql
    networks:
      - dev-net

  # --- Gitリポジトリ管理 (Gitea) ---
  gitea:
    image: gitea/gitea:28.2-rootless
    restart: always
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__server__ROOT_URL=https://gitea.j-code.org/
      - GITEA__server__DOMAIN=gitea.j-code.org
      # Git の SSH は使わない (HTTPS のみ)。2222 番は公開しない
      - GITEA__server__DISABLE_SSH=true
      - GITEA__server__START_SSH_SERVER=false
      # 初期設定画面を省略する (管理者は scripts/init-gitea.sh が作成する)
      - GITEA__security__INSTALL_LOCK=true
      # Gitea Actions (.gitea/workflows) を有効にする
      - GITEA__actions__ENABLED=true
      - GITEA__actions__DEFAULT_ACTIONS_URL=https://github.com
      # PostgreSQL接続設定（環境変数による初期化・指定）
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=db:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD=${DB_PASSWORD} # dbサービスと同じパスワード
    volumes:
      - ./gitea:/var/lib/gitea
      - ./gitea-config:/etc/gitea
    depends_on:
      - db
    networks:
      - dev-net

  # --- 自動ビルド (Gitea Actions Runner) ---
  # 初回登録に .env の GITEA_RUNNER_REGISTRATION_TOKEN を使う
  # (init-gitea.sh / go-live.sh が gitea actions generate-runner-token で発行して書き込む)
  act_runner:
    image: gitea/act_runner:0.2.11
    restart: always
    environment:
      - GITEA_INSTANCE_URL=http://gitea:3000
      - GITEA_RUNNER_REGISTRATION_TOKEN=${GITEA_RUNNER_REGISTRATION_TOKEN:-}
      - GITEA_RUNNER_NAME=vps-act-runner
      - CONFIG_FILE=/config.yaml
    volumes:
      - ./act_runner/config.yaml:/config.yaml:ro
      - ./act_runner/data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - gitea
    networks:
      - dev-net

volumes:
  caddy_data:
  caddy_config: