log:
  level: info

runner:
  file: /data/.runner
  capacity: 2
  timeout: 3h
  labels:
    - "ubuntu-latest:docker://node:20-bookworm"

container:
  # ジョブコンテナを dev-net に参加させ、http://gitea:3000 を名前解決できるようにする
  network: "dev-net"
  # ワークフローの container.volumes で使う名前付きボリュームを許可する
  valid_volumes:
    - arduino-esp32-build-cache
  options: ""
