log:
  level: info

runner:
  file: /data/.runner
  capacity: 2
  timeout: 3h
  labels:
    - "ubuntu-latest:docker://node:20-bookworm"

container:
  # 公開成果物とローカルビルドキャッシュをジョブに渡すため、これらの bind mount を許可する
  valid_volumes:
    - /var/lib/kithub/pages
    - /var/lib/kithub/build-cache
  # ジョブコンテナを dev-net に参加させ、http://gitea:3000 を名前解決できるようにする
  network: "dev-net"
  options: ""
  # build-image.sh でホストにビルドした kithub/esp32-arduino を、レジストリから取得せず使う
  force_pull: false
