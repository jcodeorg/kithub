# ワークフローの名前。Gitea の Actions 画面に表示されます。
name: Build and Release ESP32 Firmware

# main / master への push とタグの push で実行します。
# pull_request は設定していないため、PR 作成・更新では実行されません。
on:
  push:
    branches:
      - main
      - master
    tags:
      - "**"

# リリース作成と添付ファイルのアップロードに書き込み権限が必要です。
permissions:
  contents: write

# pipefail や [[ ]] を使うため、run のシェルを bash にします。
defaults:
  run:
    shell: bash

jobs:
  build-and-release:
    # このジョブ全体を Linux 環境で実行します。
    runs-on: ubuntu-latest
    container:
      # Arduino CLI・ESP32 コア・ライブラリを焼き込んだ専用イメージです (dev-env/scripts/build-image.sh で作成)。
      # Node.js も含むため actions/checkout が動きます。
      image: kithub/esp32-arduino:latest
      # ホストの s3fs マウント (R2 の gitea-pages バケット) を /publish に接続します。
      volumes:
        - /var/lib/kithub/pages:/publish

    steps:
      # リポジトリのソースコードをジョブ内に取得します。
      - name: Checkout repository
        uses: actions/checkout@v4

      # Arduino CLI、ESP32 コア、ライブラリを用意してスケッチをコンパイルします。
      - name: Build firmware
        run: |
          # どのコマンドが失敗しても、後続の処理を続けずにジョブを失敗させます。
          set -euo pipefail
          # ツール・ボードコア・ライブラリはイメージに入っているため、導入処理は不要です。
          arduino-cli version
          # コンパイルのベースは、イメージに焼き込んだものをジョブ専用の場所へコピーして使います。
          # ジョブごとに独立するため、40人が同時にビルドしても競合せず、他のジョブのキャッシュも書き換えません。
          #   コア (core.a) のキャッシュと、ライブラリのオブジェクトを含むビルドディレクトリの両方をコピーします。
          CACHE_DIR="$RUNNER_TEMP/arduino-build-cache"
          BUILD_DIR="$RUNNER_TEMP/arduino-build"
          T0=$(date +%s.%N)
          mkdir -p "$CACHE_DIR" "$BUILD_DIR"
          cp -a /opt/arduino/build-cache-base/. "$CACHE_DIR/"
          cp -a /opt/arduino/build-base/. "$BUILD_DIR/"
          T1=$(date +%s.%N)
          # 非推奨の --build-cache-path ではなく、設定でキャッシュの場所を指定します。
          arduino-cli config set build_cache.path "$CACHE_DIR"
          # キャッシュの自動削除 (purge) でコピーしたベースが消えないよう、無効にします。
          export ARDUINO_BUILD_CACHE_COMPILATIONS_BEFORE_PURGE=0
          # コアのキャッシュ (core.a) の数を、ビルド前に控えます。
          CORES_BEFORE=$(find "$CACHE_DIR/cores" -name '*.a' 2>/dev/null | wc -l)
          # 対象ボードの設定を指定してファームウェアをビルドします。ログが長くなるため -v は付けません。
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app,FlashMode=dio,FlashSize=4M" \
            --build-path "$BUILD_DIR" \
            --output-dir build \
            firmware/firmware.ino
          T2=$(date +%s.%N)
          # ビルド前からコアのキャッシュがあり、増えていなければ、再利用できています。
          CORES_AFTER=$(find "$CACHE_DIR/cores" -name '*.a' 2>/dev/null | wc -l)
          if [ "$CORES_BEFORE" -gt 0 ] && [ "$CORES_AFTER" -eq "$CORES_BEFORE" ]; then
            echo "コアのキャッシュを利用しました (core.a: $CORES_BEFORE 個)"
          else
            echo "警告: コアのキャッシュが使われていない可能性があります (ビルド前 $CORES_BEFORE 個 → 後 $CORES_AFTER 個)"
          fi
          # 所要時間の内訳。コピーに時間がかかるか、コンパイルに時間がかかるかを切り分けます。
          python3 -c 'import sys; a,b,c=map(float,sys.argv[1:]); print(f"所要時間: ベースのコピー {b-a:.1f}s / コンパイル {c-b:.1f}s")' "$T0" "$T1" "$T2"
          du -sh "$BUILD_DIR" | sed 's/^/ビルドディレクトリのサイズ: /'

          # 出力された長いファイル名を、書き込みや配布で使う名前にそろえます。
          if [ -f build/firmware.ino.bootloader.bin ]; then
            mv build/firmware.ino.bootloader.bin build/bootloader.bin
          fi
          if [ -f build/firmware.ino.partitions.bin ]; then
            mv build/firmware.ino.partitions.bin build/partitions.bin
          fi
          if [ -f build/firmware.ino.bin ]; then
            mv build/firmware.ino.bin build/firmware.bin
          fi

      # ホストの s3fs マウント (R2) に直接書き込んで公開します。R2 の認証情報はジョブに渡しません。
      - name: Publish firmware to users.j-code.org
        run: |
          set -euo pipefail
          # R2 に接続されたマウントでない場合は、コンテナ内のディスクに書いてしまうため中止します。
          if ! grep -qE ' /publish .* - fuse\.s3fs ' /proc/self/mountinfo; then
            echo "/publish が R2 (s3fs) にマウントされていません" >&2
            exit 1
          fi

          # タグ push はタグ名のフォルダー、それ以外の push は最新の latest/ に公開します。
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION=latest
          fi
          # 公開先は <owner>/<repository>/<version>/ だけに限定します。
          case "$VERSION" in *..*) echo "不正なバージョン名です" >&2; exit 1 ;; esac
          DEST="/publish/$GITHUB_REPOSITORY/$VERSION"
          mkdir -p "$DEST"

          # manifest.json が参照する3つのバイナリを並列に書き込みます。
          START=$(date +%s.%N)
          printf '%s\n' bootloader.bin partitions.bin firmware.bin \
            | xargs -P 3 -I{} cp "build/{}" "$DEST/{}"

          # Web フラッシュツールに、チップ種類と各バイナリの書き込み位置を伝える定義です。
          # バイナリの書き込み完了後に manifest を最後に配置します。
          VERSION="$VERSION" python3 - "$DEST/manifest.json" <<'PY'
          import json
          import os
          import sys

          manifest = {
              "name": "firmware",
              "version": os.environ["VERSION"],
              "new_install_prompt_erase": True,
              "builds": [
                  {
                      "chipFamily": "ESP32",
                      "parts": [
                          {"path": "bootloader.bin", "offset": 0x1000},
                          {"path": "partitions.bin", "offset": 0x8000},
                          {"path": "firmware.bin", "offset": 0x10000},
                      ],
                  }
              ],
          }
          with open(sys.argv[1], "w") as f:
              json.dump(manifest, f)
          PY
          sync "$DEST"/*
          echo "公開先: https://users.j-code.org/$GITHUB_REPOSITORY/$VERSION/ ($(python3 -c "import sys; print(f'{float(sys.argv[2])-float(sys.argv[1]):.2f}')" "$START" "$(date +%s.%N)") 秒)"

      # タグの push の場合だけ Gitea リリースを作り、ビルドしたバイナリを添付します。
      - name: Create Gitea release and upload firmware
        if: startsWith(github.ref, 'refs/tags/')
        env:
          # リリース作成 API の認証トークン。ジョブごとに自動発行される GITHUB_TOKEN を使います。
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # トークンがない場合は、失敗を明示して終了します。
          if [ -z "$GITEA_TOKEN" ]; then
            echo "GITHUB_TOKEN is not available" >&2
            exit 1
          fi
          API_URL=https://gitea.j-code.org/api/v1
          AUTH="Authorization: token $GITEA_TOKEN"
          RELEASE_URL="$API_URL/repos/$GITHUB_REPOSITORY/releases"

          # 同じタグのリリースがすでにある場合 (再実行や手動作成) は、新規作成せず再利用します。
          STATUS=$(curl --silent --output release.json --write-out '%{http_code}' \
            "$RELEASE_URL/tags/$GITHUB_REF_NAME" -H "$AUTH")
          if [ "$STATUS" = 404 ]; then
            RELEASE_PAYLOAD=$(python3 -c 'import json, os; tag = os.environ["GITHUB_REF_NAME"]; print(json.dumps({"tag_name": tag, "name": tag, "body": ""}))')
            curl --fail-with-body --silent --show-error -o release.json \
              -X POST "$RELEASE_URL" \
              -H "$AUTH" -H "Content-Type: application/json" \
              --data "$RELEASE_PAYLOAD"
          elif [ "$STATUS" != 200 ]; then
            echo "リリースの取得に失敗しました (HTTP $STATUS)" >&2
            cat release.json >&2
            exit 1
          fi
          RELEASE_ID=$(python3 -c 'import json; print(json.load(open("release.json"))["id"])')

          # 3つのファームウェアバイナリをリリースの添付ファイルとしてアップロードします。
          # 同名の添付が残っていると失敗するため、先に削除します。
          for file in build/bootloader.bin build/partitions.bin build/firmware.bin; do
            ASSET_NAME=$(basename "$file")
            export ASSET_NAME
            ENCODED_NAME=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["ASSET_NAME"]))')
            for old_id in $(python3 -c 'import json, os; [print(a["id"]) for a in json.load(open("release.json")).get("assets", []) if a["name"] == os.environ["ASSET_NAME"]]'); do
              curl --fail-with-body --silent --show-error \
                -X DELETE "$RELEASE_URL/$RELEASE_ID/assets/$old_id" -H "$AUTH"
            done
            curl --fail-with-body --silent --show-error \
              -X POST "$API_URL/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$ENCODED_NAME" \
              -H "Authorization: token $GITEA_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$file"
          done
