# ESP32 (arduino-cli) ビルド → users.j-code.org へ公開 → タグ時に Gitea リリース
#
# 前提 (dev-env/docker-compose.yml の drone-runner に設定済み):
#   DRONE_RUNNER_VOLUMES=/home/kithub/dev-env/pages:/publish,/home/kithub/dev-env/cache:/ci-cache
#   - /publish  : users.j-code.org のドキュメントルート
#   - /ci-cache : ビルドキャッシュ (arduino-cli のコア/ライブラリ/ビルド成果)
#                 同時に複数ビルドが走っても壊れないよう、flock で直列化しています。
#
# 注意: 次の更新はキャッシュ側にあるため、手動で行います。
#   - arduino-cli を更新するには、ホストの /home/kithub/dev-env/cache/bin を削除します。
#   - ESP32コアのバージョンを変えるには、ホストの /home/kithub/dev-env/cache/data を削除します。
#
# ランナー側でマウントするため、リポジトリの Trusted 設定や `volumes: host:` は不要。
kind: pipeline
type: docker
name: build-and-release-esp32

trigger:
  branch:
    - main
    - master
  event:
    - push
    - pull_request
    - tag

steps:
  # --- 1. arduino-cli の準備、ボード・ライブラリ導入、ビルド ---
  - name: build-firmware
    # curl / git を最初から含むため、apt-get は不要
    image: python:3.11
    environment:
      HOME: /root
      PATH: /ci-cache/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
      PYTHONPATH: /ci-cache/pylib
    commands:
      - mkdir -p /ci-cache/bin /ci-cache/data /ci-cache/user/libraries /ci-cache/build
      # 共有キャッシュを触る処理 (導入・更新・コンパイル) を、複数ビルド間で直列化する。
      # fd 9 のロックはこのステップのシェルが終了すると自動的に解放される (異常終了時も)
      - exec 9>/ci-cache/.build.lock
      - echo "他のビルドのキャッシュ使用が終わるまで待機します (最大30分)"
      - flock -w 1800 9
      # arduino-cli はキャッシュに無いときだけダウンロード (更新したい場合は /ci-cache/bin を削除)
      - |
        if [ ! -x /ci-cache/bin/arduino-cli ]; then
          curl -fsSL --ipv4 --connect-timeout 20 --retry 5 --retry-delay 5 --retry-all-errors https://downloads.arduino.cc/arduino-cli/arduino-cli_latest_Linux_64bit.tar.gz | tar -xz -C /ci-cache/bin arduino-cli
        fi
      - arduino-cli version
      # esptool.py が必要とする Python モジュール (キャッシュに無いときだけ導入)
      - |
        if [ ! -d /ci-cache/pylib/serial ]; then
          pip install --no-cache-dir --disable-pip-version-check --target /ci-cache/pylib pyserial
        fi
      # キャッシュ領域 (/ci-cache) を使って ESP32 コア 2.0.14 を導入
      - arduino-cli config init --overwrite
      - arduino-cli config set directories.data /ci-cache/data
      - arduino-cli config set directories.user /ci-cache/user
      - arduino-cli config set build_cache.path /ci-cache/build
      - arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
      - |
        if [ ! -d /ci-cache/data/packages/esp32/hardware/esp32/2.0.14 ]; then
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.14
        fi
      # ライブラリのインストール
      - |
        if [ -d /ci-cache/user/libraries/ESP32-A2DP/.git ]; then
          git -C /ci-cache/user/libraries/ESP32-A2DP pull --ff-only
        elif [ -e /ci-cache/user/libraries/ESP32-A2DP ]; then
          echo "Cached ESP32-A2DP directory is not a Git repository" >&2
          exit 1
        else
          git clone --depth 1 https://github.com/pschatzmann/ESP32-A2DP.git /ci-cache/user/libraries/ESP32-A2DP
        fi
      - arduino-cli lib install "U8g2"
      - arduino-cli lib install "Adafruit AHTX0"
      - arduino-cli lib install "BH1750"
      - arduino-cli lib install "Adafruit NeoPixel"
      # スケッチのコンパイル
      # --build-path は指定しない (指定すると共有 build cache が使われず、毎回フルビルドになる)
      - |
        arduino-cli compile \
          --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app,FlashMode=dio,FlashSize=4M" \
          --output-dir build \
          firmware/firmware.ino
      # バイナリファイル名の正規化 (リネーム)
      - |
        if [ -f build/firmware.ino.bootloader.bin ]; then
          mv build/firmware.ino.bootloader.bin build/bootloader.bin
        fi
        if [ -f build/firmware.ino.partitions.bin ]; then
          mv build/firmware.ino.partitions.bin build/partitions.bin
        fi
        if [ -f build/firmware.ino.bin ]; then
          mv build/firmware.ino.bin build/firmware.bin
        fi

  # --- 2. users.j-code.org へ成果物を公開 ---
  # 公開先: /<オーナー名>/<リポジトリ名>/latest/ (ブランチPush時)
  #         /<オーナー名>/<リポジトリ名>/<タグ>/    (タグ時)
  - name: publish-to-pages
    image: alpine:3
    commands:
      - |
        if [ "$DRONE_BUILD_EVENT" = "tag" ]; then
          VERSION="$DRONE_TAG"
        else
          VERSION="latest"
        fi
        DEST="/publish/$DRONE_REPO/$VERSION"
        mkdir -p "$DEST"
        cp build/bootloader.bin build/partitions.bin build/firmware.bin "$DEST/"
        BOOTLOADER_OFFSET=$((0x1000))
        PARTITIONS_OFFSET=$((0x8000))
        FIRMWARE_OFFSET=$((0x10000))
        cat > "$DEST/manifest.json" <<EOF
        {
          "name": "firmware",
          "version": "$VERSION",
          "new_install_prompt_erase": true,
          "builds": [
            {
              "chipFamily": "ESP32",
              "parts": [
                { "path": "bootloader.bin", "offset": $BOOTLOADER_OFFSET },
                { "path": "partitions.bin", "offset": $PARTITIONS_OFFSET },
                { "path": "firmware.bin", "offset": $FIRMWARE_OFFSET }
              ]
            }
          ]
        }
        EOF
        chmod -R a+rX "/publish/$DRONE_REPO_OWNER"
        echo "公開先: https://users.j-code.org/${DEST#/publish/}/"
    when:
      event:
        - push
        - tag

  # --- 3. タグPush時に Gitea へリリース作成 ＆ バイナリ添付 ---
  - name: release-to-gitea
    image: plugins/gitea-release
    settings:
      base_url: https://gitea.j-code.org
      api_key:
        from_secret: gitea_token # Drone Secrets に登録した Access Token
      files:
        - build/bootloader.bin
        - build/partitions.bin
        - build/firmware.bin
    when:
      event:
        - tag